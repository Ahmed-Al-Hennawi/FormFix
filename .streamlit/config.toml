# ==========================================================================
# FormFix - Streamlit configuration
#
# Dark theme matching the "Cyber Pulse" palette, no toolbar or sidebar, and
# static file serving so images get cached instead of re-sent on every rerun.
# ==========================================================================

[theme]
base = "dark"

# Electric Cyan - the FormFix accent
primaryColor = "#00F0FF"

# Deep Space Blue - the page background
backgroundColor = "#0B132B"

# Graphite - cards, inputs, widget surfaces
secondaryBackgroundColor = "#1C2541"

textColor = "#FFFFFF"

font = "sans serif"

[server]
# Serves streamlit_app/static/ at app/static/... - used by utils/assets.py
enableStaticServing = true
headless = true

# a 120 s phone clip can go over Streamlit's 200 MB default, so 300 MB
maxUploadSize = 300

[browser]
gatherUsageStats = false

[client]

showErrorDetails = "none"
toolbarMode = "minimal"

[runner]
magicEnabled = false
