<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1755" viewBox="0 0 760 1755" role="img" aria-label="Homepage — how it works and exercise explorer (mobile) wireframe"><title>Homepage — how it works and exercise explorer (mobile)</title><rect width="760" height="1755" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Homepage — how it works and exercise explorer (mobile)</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Mobile 390px · rail collapses to a single column, explorer stacks copy above figure</text><text x="716" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="716" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">m03-home-sections-mobile.svg</text><rect x="185.0" y="96" width="390" height="1613" rx="22" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M185.0 118 a22 22 0 0 1 22 -22 h346 a22 22 0 0 1 22 22 v12 h-390 z" fill="#f0f0f1" stroke="#c2c2c6" /><rect x="346.0" y="103" width="68" height="13" rx="6.5" fill="#dcdcdf" /><text x="201.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f">9:41</text><line x1="185.0" y1="130" x2="575.0" y2="130" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="205.0" y="170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">HOW FORMFIX WORKS</text><text x="205.0" y="206.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#2c2c2e" text-anchor="start">From your camera roll</text><text x="205.0" y="236.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#2c2c2e" text-anchor="start">to a clear correction.</text><rect x="205.0" y="274.0" width="350.0" height="116.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="235.0" cy="304.0" r="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="235.0" y="308.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2c2c2e" text-anchor="middle">01</text><text x="263.0" y="308.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Record</text><text x="223.0" y="334.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Film a short clip of your set. Any phone camera works.</text><rect x="205.0" y="402.0" width="350.0" height="116.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="235.0" cy="432.0" r="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="235.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2c2c2e" text-anchor="middle">02</text><text x="263.0" y="436.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Upload</text><text x="223.0" y="462.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Drop the video into FormFix. No account, no setup.</text><rect x="205.0" y="530.0" width="350.0" height="116.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="235.0" cy="560.0" r="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="235.0" y="564.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2c2c2e" text-anchor="middle">03</text><text x="263.0" y="564.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Analyse</text><text x="223.0" y="590.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Computer vision tracks 33 body landmarks through every</text><text x="223.0" y="607.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">frame of the movement.</text><rect x="205.0" y="658.0" width="350.0" height="116.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="235.0" cy="688.0" r="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="235.0" y="692.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2c2c2e" text-anchor="middle">04</text><text x="263.0" y="692.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Understand</text><text x="223.0" y="718.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Transparent movement rules check joint angles,</text><text x="223.0" y="735.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">alignment and symmetry - and identify what went wrong.</text><rect x="205.0" y="786.0" width="350.0" height="116.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="235.0" cy="816.0" r="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="235.0" y="820.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2c2c2e" text-anchor="middle">05</text><text x="263.0" y="820.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Improve</text><text x="223.0" y="846.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">You get clear, human-readable feedback you can apply</text><text x="223.0" y="863.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">on your very next set.</text><text x="205.0" y="934.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">EXERCISE EXPLORER</text><text x="205.0" y="970.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#2c2c2e" text-anchor="start">Three movements.</text><text x="205.0" y="1000.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#2c2c2e" text-anchor="start">One analysis engine.</text><rect x="205.0" y="1026.0" width="59.0" height="34.0" rx="17" fill="#3a3a3c" stroke="none" /><text x="234.5" y="1048.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">Squat</text><rect x="272.0" y="1026.0" width="118.4" height="34.0" rx="17" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="331.2" y="1048.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5f5f63" text-anchor="middle">Shoulder Press</text><rect x="398.4" y="1026.0" width="105.2" height="34.0" rx="17" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="451.0" y="1048.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#5f5f63" text-anchor="middle">Lat Pulldown</text><text x="205.0" y="1092.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c2c2e" text-anchor="start">Squat</text><text x="555.0" y="1092.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="end">01 / 03</text><text x="205.0" y="1118.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Analysed from the side, FormFix tracks how deep your hips</text><text x="205.0" y="1137.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">descend, how far your chest leans forward, whether your</text><text x="205.0" y="1156.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">heels stay planted, and whether you stand tall between</text><text x="205.0" y="1175.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">repetitions.</text><circle cx="209.0" cy="1197.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="221.0" y="1201.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Hip depth</text><circle cx="209.0" cy="1219.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="221.0" y="1223.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Torso angle</text><circle cx="209.0" cy="1241.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="221.0" y="1245.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Heel contact</text><circle cx="209.0" cy="1263.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="221.0" y="1267.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Return to standing</text><rect x="205.0" y="1301.0" width="350.0" height="300.0" rx="5" fill="#eeeeef" stroke="#c2c2c6" stroke-width="1" /><line x1="205.0" y1="1301.0" x2="555.0" y2="1601.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><line x1="555.0" y1="1301.0" x2="205.0" y2="1601.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><rect x="215.0" y="1571.0" width="126.4" height="20.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="225.0" y="1585.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start" letter-spacing="0.5">exercise photograph</text><line x1="350.6" y1="1395.0" x2="409.4" y2="1395.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="356.9" y1="1462.5" x2="403.1" y2="1462.5" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="350.6" y1="1395.0" x2="356.9" y2="1462.5" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="409.4" y1="1395.0" x2="403.1" y2="1462.5" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="350.6" y1="1395.0" x2="335.9" y2="1435.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="335.9" y1="1435.0" x2="344.3" y2="1470.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="409.4" y1="1395.0" x2="424.1" y2="1435.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="424.1" y1="1435.0" x2="415.7" y2="1470.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="356.9" y1="1462.5" x2="350.6" y2="1510.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="350.6" y1="1510.0" x2="354.8" y2="1555.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="403.1" y1="1462.5" x2="409.4" y2="1510.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="409.4" y1="1510.0" x2="405.2" y2="1555.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="380.0" y1="1366.5" x2="380.0" y2="1395.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><circle cx="380.0" cy="1357.5" r="9" fill="#ffffff" stroke="#8f8f95" stroke-width="1.4" /><circle cx="350.6" cy="1395.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="409.4" cy="1395.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="335.9" cy="1435.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="424.1" cy="1435.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="344.3" cy="1470.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="415.7" cy="1470.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="356.9" cy="1462.5" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="403.1" cy="1462.5" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="350.6" cy="1510.0" r="4" fill="#3a3a3c" stroke="#8f8f95" stroke-width="1.3" /><circle cx="409.4" cy="1510.0" r="4" fill="#3a3a3c" stroke="#8f8f95" stroke-width="1.3" /><circle cx="354.8" cy="1555.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><circle cx="405.2" cy="1555.0" r="3" fill="#ffffff" stroke="#8f8f95" stroke-width="1.3" /><rect x="215.0" y="1569.0" width="131.0" height="19.0" rx="9.5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="224.0" y="1581.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">● KNEE ANGLE 92°</text><rect x="205.0" y="1621.0" width="40.0" height="40.0" rx="20" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="225.0" y="1647.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5f5f63" text-anchor="middle">←</text><rect x="255.0" y="1621.0" width="40.0" height="40.0" rx="20" fill="#ffffff" stroke="#c2c