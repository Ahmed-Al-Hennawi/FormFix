<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1300" viewBox="0 0 760 1300" role="img" aria-label="Analyse — idle (mobile) wireframe"><title>Analyse — idle (mobile)</title><rect width="760" height="1300" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Analyse — idle (mobile)</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Mobile 390px · columns stack: upload first, then the results placeholder</text><text x="716" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="716" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">m04-analyse-idle-mobile.svg</text><rect x="185.0" y="96" width="390" height="1158" rx="22" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M185.0 118 a22 22 0 0 1 22 -22 h346 a22 22 0 0 1 22 22 v12 h-390 z" fill="#f0f0f1" stroke="#c2c2c6" /><rect x="346.0" y="103" width="68" height="13" rx="6.5" fill="#dcdcdf" /><text x="201.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f">9:41</text><line x1="185.0" y1="130" x2="575.0" y2="130" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="205.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5f5f63" text-anchor="start">←  Back Home</text><text x="555.0" y="164.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#2c2c2e" text-anchor="end">FORMFIX</text><text x="205.0" y="204.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">ANALYSE YOUR FORM</text><text x="205.0" y="238.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2c2c2e" text-anchor="start">Upload a set.</text><text x="205.0" y="270.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2c2c2e" text-anchor="start">Get an explanation.</text><text x="205.0" y="300.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Record a single set, drop the clip in, and FormFix will</text><text x="205.0" y="319.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">track your body through the movement and explain what it</text><text x="205.0" y="338.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">sees.</text><circle cx="233.0" cy="394.0" r="15" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.5" /><circle cx="233.0" cy="394.0" r="5" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="233.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2c2c2e" text-anchor="middle">Upload</text><line x1="253.0" y1="394.0" x2="360.0" y2="394.0" stroke="#dededf" stroke-width="2" stroke-linecap="round" /><circle cx="380.0" cy="394.0" r="15" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.5" /><text x="380.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="middle">Analyse</text><line x1="400.0" y1="394.0" x2="507.0" y2="394.0" stroke="#dededf" stroke-width="2" stroke-linecap="round" /><circle cx="527.0" cy="394.0" r="15" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.5" /><text x="527.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="middle">Feedback</text><rect x="205.0" y="460.0" width="34.0" height="26.0" rx="5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="222.0" y="478.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2c2c2e" text-anchor="middle">01</text><text x="253.0" y="479.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2c2c2e" text-anchor="start">Your video</text><text x="205.0" y="520.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">MP4 · MOV · AVI · 3-120 seconds · one set per clip</text><rect x="205.0" y="542.0" width="350.0" height="34.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="225.0" cy="559.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><circle cx="225.0" cy="559.0" r="3.5" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="243.0" y="563.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2c2c2e" text-anchor="start">Squat</text><rect x="205.0" y="582.0" width="350.0" height="34.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><circle cx="225.0" cy="599.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="243.0" y="603.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2c2c2e" text-anchor="start">Shoulder Press</text><rect x="205.0" y="622.0" width="350.0" height="34.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><circle cx="225.0" cy="639.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="243.0" y="643.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2c2c2e" text-anchor="start">Lat Pulldown</text><rect x="205.0" y="678.0" width="350.0" height="168.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="221.0" y="700.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.2">HOW TO RECORD</text><rect x="447.0" y="688.0" width="94.7" height="19.0" rx="9.5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="456.0" y="700.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SIDE-ON VIEW</text><circle cx="225.0" cy="722.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="237.0" y="726.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">Film from the side, roughly level with your hips.</text><circle cx="225.0" cy="756.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="237.0" y="760.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep your hips, knees and ankles in frame for the whole</text><text x="237.0" y="774.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">set.</text><circle cx="225.0" cy="790.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="237.0" y="794.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep the camera still, and record several controlled</text><text x="237.0" y="808.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">repetitions.</text><circle cx="225.0" cy="824.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="237.0" y="828.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">Start standing, perform several full squats, and finish</text><text x="237.0" y="842.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5f5f63" text-anchor="start">standing.</text><rect x="205.0" y="866.0" width="350.0" height="110.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="6 5" /><rect x="362.0" y="888.0" width="36.0" height="32.0" rx="6" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="380.0" y="910.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a8f" text-anchor="middle">↥</text><text x="380.0" y="938.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2c2c2e" text-anchor="middle">Drag and drop file here</text><rect x="320.0" y="948.0" width="120.0" height="26.0" rx="13.0" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="380.0" y="964.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#2c2c2e" text-anchor="middle">Browse files</text><text x="205.0" y="974.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5f5f63" text-anchor="start">Your video is deleted as soon as it has been analysed, and no account</text><text x="205.0" y="988.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5f5f63" text-anchor="start">is needed.</text><rect x="205.0" y="1016.0" width="350.0" height="190.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="6 5" /><text x="225.0" y="1048.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">WAITING FOR A VIDEO</text><text x="225.0" y="1078.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Your results will appear here</text><text x="225.0" y="1104.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Nothing is analysed until you press Analyse Form.</text><circle cx="231.0" cy="1134.0" r="3" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="243.0" y="1138.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Form score</text><circle cx="231.0" cy="1156.0" r="3" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="243.0" y="1160.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="start">What you did well</text><circle cx="231.0" cy="1178.0" r="3" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="243.0" y="1182.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="start">What to improve</text></g><text x="44" y="1282" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="185.0" y="130" width="390" height="1124" /></clipPath></defs></svg>