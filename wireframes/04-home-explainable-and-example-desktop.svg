<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1802" viewBox="0 0 1528 1802" role="img" aria-label="Homepage — explainable feedback and the example analysis wireframe"><title>Homepage — explainable feedback and the example analysis</title><rect width="1528" height="1802" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Homepage — explainable feedback and the example analysis</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Desktop 1440px · components/explainable.py, components/results_section.py</text><text x="1484" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="1484" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">04-home-explainable-and-example-desktop.svg</text><rect x="44.0" y="96" width="1440" height="1660" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M44.0 106 a10 10 0 0 1 10 -10 h1420 a10 10 0 0 1 10 10 v30 h-1440 z" fill="#f0f0f1" stroke="#c2c2c6" /><circle cx="64.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="79.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="94.0" cy="116" r="4.5" fill="#d5d5d8" /><rect x="120.0" y="106" width="360" height="20" rx="10" fill="#ffffff" stroke="#c2c2c6" /><text x="132.0" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8a8f">formfix.app/</text><line x1="44.0" y1="136" x2="1484.0" y2="136" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="164.0" y="166.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">EXPLAINABLE FEEDBACK</text><text x="164.0" y="212.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c2c2e" text-anchor="start">Not a score.</text><text x="164.0" y="254.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c2c2e" text-anchor="start">An explanation.</text><text x="164.0" y="296.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">FormFix doesn&#x27;t just hand you a grade. Every correction says what happened, why it matters and</text><text x="164.0" y="318.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">what to try instead. Here is one from the session reported further down this page.</text><rect x="164.0" y="366.0" width="580.0" height="220.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="190.0" y="400.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8a8a8f" text-anchor="start">What a black box tells you</text><text x="190.0" y="448.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#7a7a7f" text-anchor="start">✕  Incorrect exercise.</text><rect x="784.0" y="366.0" width="580.0" height="220.0" rx="5" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.4" /><text x="810.0" y="400.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#8a8a8f" text-anchor="start">What FormFix tells you</text><text x="810.0" y="428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">SQUAT DEPTH</text><text x="810.0" y="458.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2c2c2e" text-anchor="start">You stop a little high on 2 of your 6 reps.</text><text x="810.0" y="492.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">Squatting lower works your legs through their full range.</text><rect x="810.0" y="524.0" width="74.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="819.0" y="536.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">TRY THIS</text><text x="810.0" y="560.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Lower until your hips reach about knee height, keeping your whole foot planted.</text><text x="164.0" y="654.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e" text-anchor="start">The rule behind that message</text><text x="164.0" y="680.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">None of it is guesswork. You can follow any correction back through the three steps that</text><text x="164.0" y="701.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">produced it.</text><rect x="164.0" y="732.0" width="356.0" height="132.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="184.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">WHAT IT SAW</text><text x="184.0" y="792.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">On 2 of your 6 reps, your knees stopped bending at</text><text x="184.0" y="811.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">118°.</text><rect x="586.0" y="732.0" width="356.0" height="132.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="606.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">WHAT IT CHECKED</text><text x="606.0" y="792.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">The depth check looks for 115° or lower. 118° is</text><text x="606.0" y="811.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">short of it.</text><line x1="530.0" y1="798.0" x2="576.0" y2="798.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><text x="570.0" y="802.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#8a8a8f" text-anchor="start">▶</text><rect x="1008.0" y="732.0" width="356.0" height="132.0" rx="5" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.4" /><text x="1028.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">WHAT IT SAID</text><text x="1028.0" y="792.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">“You stop a little high on 2 of your 6 reps.”</text><line x1="952.0" y1="798.0" x2="998.0" y2="798.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><text x="992.0" y="802.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#8a8a8f" text-anchor="start">▶</text><text x="164.0" y="908.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8f" text-anchor="start">That 115° is a starting value, not a fixed truth. FormFix prints the number behind every correction, so you can always see</text><text x="164.0" y="928.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8f" text-anchor="start">what it was measured against.</text><line x1="164.0" y1="982.0" x2="1364.0" y2="982.0" stroke="#dededf" stroke-width="1" stroke-linecap="round" /><text x="324.0" y="1052.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">EXAMPLE ANALYSIS</text><text x="324.0" y="1100.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c2c2e" text-anchor="start">What a session looks like.</text><rect x="324.0" y="1152.0" width="880.0" height="466.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="354.0" y="1196.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2c2c2e" text-anchor="start">Squat Analysis</text><text x="354.0" y="1220.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">squat_session_004.mp4 · 00:12 · reps detected: 6</text><rect x="994.0" y="1184.0" width="152.2" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="1003.0" y="1196.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">● ANALYSIS COMPLETE</text><line x1="354.0" y1="1248.0" x2="1174.0" y2="1248.0" stroke="#dededf" stroke-width="1" stroke-linecap="round" /><text x="354.0" y="1290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Pose detection</text><rect x="624.0" y="1286.0" width="320.0" height="8.0" rx="4" fill="#ebebec" stroke="none" /><rect x="624.0" y="1286.0" width="320.0" height="8.0" rx="4" fill="#3a3a3c" stroke="none" /><rect x="1024.0" y="1280.0" width="88.7" height="19.0" rx="9.5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1033.0" y="1292.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SUCCESSFUL</text><text x="354.0" y="1336.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Squat depth</text><text x="354.0" y="1353.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">4 of 6 reps</text><rect x="624.0" y="1332.0" width="320.0" height="8.0" rx="4" fill="#ebebec" stroke="none" /><rect x="624.0" y="1332.0" width="214.4" height="8.0" rx="4" fill="#3a3a3c" stroke="none" /><rect x="1024.0" y="1326.0" width="124.0" height="19.0" rx="9.5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1033.0" y="1338.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">NEEDS ATTENTION</text><text x="354.0" y="1382.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Forward torso lean</text><text x="354.0" y="1399.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">6 of 6 reps</text><rect x="624.0" y="1378.0" width="320.0" height="8.0" rx="4" fill="#ebebec" stroke="none" /><rect x="624.0" y="1378.0" width="294.4" height="8.0" rx="4" fill="#3a3a3c" stroke="none" /><rect x="1024.0" y="1372.0" width="46.3" height="19.0" rx="9.5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1033.0" y="1384.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">GOOD</text><text x="354.0" y="1428.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Heel stability</text><text x="354.0" y="1445.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">6 of 6 reps</text><rect x="624.0" y="1424.0" width="320.0" height="8.0" rx="4" fill="#ebebec" stroke="none" /><rect x="624.0" y="1424.0" width="320.0" height="8.0" rx="4" fill="#3a3a3c" stroke="none" /><rect x="1024.0" y="1418.0" width="46.3" height="19.0" rx="9.5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1033.0" y="1430.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">GOOD</text><text x="354.0" y="1474.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Return to standing</text><text x="354.0" y="1491.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">6 of 6 reps</text><rect x="624.0" y="1470.0" width="320.0" height="8.0" rx="4" fill="#ebebec" stroke="none" /><rect x="624.0" y="1470.0" width="320.0" height="8.0" rx="4" fill="#3a3a3c" stroke="none" /><rect x="1024.0" y="1464.0" width="46.3" height="19.0" rx="9.5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1033.0" y="1476.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">GOOD</text><line x1="354.0" y1="1512.0" x2="1174.0" y2="1512.0" stroke="#dededf" stroke-width="1" stroke-linecap="round" /><text x="354.0" y="1548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.4">FEEDBACK</text><text x="354.0" y="1574.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5f63" text-anchor="start">Two of your repetitions stopped above the configured depth target. Lowering a little further under control will even the set</text><text x="354.0" y="1595.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5f63" text-anchor="start">out.</text><line x1="1234.0" y1="1273.0" x2="1234.0" y2="1331.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="1241.0" y="1282.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Same markup as the live results</text><text x="1241.0" y="1296.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">card, so the promise on the</text><text x="1241.0" y="1310.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">marketing page and the real output</text><text x="1241.0" y="1324.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">cannot drift apart.</text></g><text x="44" y="1784" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="1620" /></clipPath></defs></svg>