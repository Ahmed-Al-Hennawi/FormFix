vetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#2c2c2e" text-anchor="start">Transparent by design.</text><rect x="164.0" y="252.0" width="277.5" height="200.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="186.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8f" text-anchor="start">01</text><text x="186.0" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Computer Vision</text><text x="186.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Your uploaded video is processed frame</text><text x="186.0" y="379.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">by frame. A phone camera is all it</text><text x="186.0" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">takes.</text><rect x="471.5" y="252.0" width="277.5" height="200.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="493.5" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8f" text-anchor="start">02</text><text x="493.5" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Pose Estimation</text><text x="493.5" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">A 33-landmark human pose model maps</text><text x="493.5" y="379.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">your joints through the entire</text><text x="493.5" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">movement.</text><rect x="779.0" y="252.0" width="277.5" height="200.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="801.0" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8f" text-anchor="start">03</text><text x="801.0" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Movement Rules</text><text x="801.0" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Transparent, testable rules evaluate</text><text x="801.0" y="379.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">angles, alignment and symmetry. No</text><text x="801.0" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">black box.</text><rect x="1086.5" y="252.0" width="277.5" height="200.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="1108.5" y="294.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a8a8f" text-anchor="start">04</text><text x="1108.5" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Explainable Feedback</text><text x="1108.5" y="360.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Every message traces back to the exact</text><text x="1108.5" y="379.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">rule - and the exact moment - that</text><text x="1108.5" y="398.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">triggered it.</text><rect x="164.0" y="572.0" width="1200.0" height="590.0" rx="12" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="764.0" y="632.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#2c2c2e" text-anchor="middle">Academic &amp; Technical Foundation</text><text x="764.0" y="662.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a8a8f" text-anchor="middle">Grounded in Explainable Computer Vision and Human Pose Estimation Research</text><text x="764.0" y="700.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5f63" text-anchor="middle">FormFix was developed as a university research project investigating how computer vision can provide</text><text x="764.0" y="722.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5f63" text-anchor="middle">accessible, explainable movement feedback for beginner gym users.</text><rect x="609.0" y="762.0" width="310.0" height="46.0" rx="23.0" fill="#3a3a3c" stroke="none" /><text x="764.0" y="789.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Read Full Research Paper (PDF)</text><rect x="224.0" y="842.0" width="525.0" height="112.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="244.0" y="872.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c2c2e" text-anchor="start">1. Research Question</text><text x="244.0" y="896.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">How can explainable computer vision support beginner gym users in identifying and</text><text x="244.0" y="913.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">correcting common exercise technique mistakes from uploaded workout videos?</text><rect x="779.0" y="842.0" width="525.0" height="112.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="799.0" y="872.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c2c2e" text-anchor="start">2. The Problem</text><text x="799.0" y="896.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Beginners often learn exercises from online videos but struggle to self-evaluate</text><text x="799.0" y="913.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">subtle technical errors. Personal training is expensive, and asking for help in the</text><text x="799.0" y="930.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">gym can cause anxiety.</text><rect x="224.0" y="972.0" width="525.0" height="112.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="244.0" y="1002.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c2c2e" text-anchor="start">3. The Solution &amp; Method</text><text x="244.0" y="1026.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Vision Pipeline: 2D joint coordinates from smartphone video using MediaPipe Pose.</text><text x="244.0" y="1043.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Kinematic Evaluation: joint angles against biomechanical rules. Explainable</text><text x="244.0" y="1060.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Feedback: raw kinematics converted into plain-English feedback.</text><rect x="779.0" y="972.0" width="525.0" height="112.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="799.0" y="1002.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c2c2e" text-anchor="start">4. Evaluation &amp; Results</text><text x="799.0" y="1026.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Evaluated across three dimensions: Technical Accuracy, User Understanding, and</text><text x="799.0" y="1043.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">System Usability (System Usability Scale score).</text><text x="764.0" y="1128.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="middle">FormFix (2026). An Explainable Computer Vision System for Exercise Form Assessment and Corrective Feedback.</text><rect x="654.0" y="1292.0" width="220.0" height="76.0" rx="5" fill="#eeeeef" stroke="#c2c2c6" stroke-width="1" /><line x1="654.0" y1="1292.0" x2="874.0" y2="1368.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><line x1="874.0" y1="1292.0" x2="654.0" y2="1368.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><rect x="664.0" y="1338.0" width="42.4" height="20.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="674.0" y="1352.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start" letter-spacing="0.5">logo</text><text x="764.0" y="1432.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#2c2c2e" text-anchor="middle">Better movement starts</text><text x="764.0" y="1478.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" fill="#2c2c2e" text-anchor="middle">with understanding it.</text><rect x="624.0" y="1524.0" width="280.0" height="56.0" rx="28.0" fill="#3a3a3c" stroke="none" /><text x="764.0" y="1557.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Analyse Your Form  →</text><line x1="164.0" y1="1632.0" x2="1364.0" y2="1632.0" stroke="#dededf" stroke-width="1" stroke-linecap="round" /><text x="764.0" y="1668.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="middle">FormFix is an educational exercise-technique tool and is not a replacement for professional coaching or medical advice.</text><text x="764.0" y="1698.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#b4b4b8" text-anchor="middle" letter-spacing="0.8">FORMFIX     ·     MSc Computer Science · Thesis Project     ·     2026</text></g><text x="44" y="1808" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="1644" /></clipPath></defs></svg>