<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1779" viewBox="0 0 760 1779" role="img" aria-label="Homepage — hero and &quot;what this is&quot; wireframe"><title>Homepage — hero and &quot;what this is&quot;</title><rect width="760" height="1779" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Homepage — hero and &quot;what this is&quot;</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Mobile 390px · single column, navigation collapses to a menu button</text><text x="716" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="716" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">m01-home-hero-mobile.svg</text><rect x="185.0" y="96" width="390" height="1637" rx="22" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M185.0 118 a22 22 0 0 1 22 -22 h346 a22 22 0 0 1 22 22 v12 h-390 z" fill="#f0f0f1" stroke="#c2c2c6" /><rect x="346.0" y="103" width="68" height="13" rx="6.5" fill="#dcdcdf" /><text x="201.0" y="118" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f">9:41</text><line x1="185.0" y1="130" x2="575.0" y2="130" stroke="#c2c2c6" /><g clip-path="url(#clip)"><rect x="205.0" y="142.0" width="350.0" height="54.0" rx="27" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><rect x="221.0" y="157.0" width="26.0" height="24.0" rx="4" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="255.0" y="175.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2c2c2e" text-anchor="start">FORMFIX</text><rect x="509.0" y="158.0" width="26.0" height="22.0" rx="4" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><line x1="515.0" y1="165.0" x2="529.0" y2="165.0" stroke="#2c2c2e" stroke-width="1.6" stroke-linecap="round" /><line x1="515.0" y1="173.0" x2="529.0" y2="173.0" stroke="#2c2c2e" stroke-width="1.6" stroke-linecap="round" /><text x="205.0" y="230.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">EXPLAINABLE COMPUTER VISION</text><text x="205.0" y="246.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">FOR PEOPLE LEARNING TO LIFT</text><text x="205.0" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2c2c2e" text-anchor="start">See your form.</text><text x="205.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2c2c2e" text-anchor="start">Understand your movement.</text><text x="205.0" y="348.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#2c2c2e" text-anchor="start">Improve your technique.</text><text x="205.0" y="390.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">FormFix analyses a short video of your squat, dumbbell</text><text x="205.0" y="410.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">shoulder press or lat pulldown, tracks how your body</text><text x="205.0" y="430.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">moves, and explains - in plain language - what to change</text><text x="205.0" y="450.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">and why.</text><rect x="205.0" y="480.0" width="350.0" height="48.0" rx="24.0" fill="#3a3a3c" stroke="none" /><text x="380.0" y="508.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Analyse Your Form  →</text><rect x="205.0" y="538.0" width="350.0" height="48.0" rx="24.0" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="380.0" y="566.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#2c2c2e" text-anchor="middle">See How It Works</text><rect x="205.0" y="612.0" width="350.0" height="330.0" rx="5" fill="#eeeeef" stroke="#c2c2c6" stroke-width="1" /><line x1="205.0" y1="612.0" x2="555.0" y2="942.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><line x1="555.0" y1="612.0" x2="205.0" y2="942.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><rect x="215.0" y="912.0" width="120.8" height="20.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="225.0" y="926.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start" letter-spacing="0.5">athlete photograph</text><line x1="347.8" y1="716.4" x2="412.2" y2="716.4" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="354.7" y1="792.0" x2="405.3" y2="792.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="347.8" y1="716.4" x2="354.7" y2="792.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="412.2" y1="716.4" x2="405.3" y2="792.0" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="347.8" y1="716.4" x2="331.7" y2="761.2" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="331.7" y1="761.2" x2="340.9" y2="800.4" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" /><line x1="412.2" y1="716.4" x2="428.3" y2="761.2" stroke="#9a9aa0" stroke-width="1.4" stroke-l