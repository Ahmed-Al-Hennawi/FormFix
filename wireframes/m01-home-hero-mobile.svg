ca Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">● POSE DETECTED</text><rect x="376.6" y="910.0" width="166.4" height="19.0" rx="9.5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="385.6" y="922.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">TRACKING 33 LANDMARKS</text><text x="380.0" y="992.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#8a8a8f" text-anchor="middle" letter-spacing="1.6">SCROLL</text><line x1="205.0" y1="1034.0" x2="555.0" y2="1034.0" stroke="#dededf" stroke-width="1" stroke-linecap="round" /><text x="205.0" y="1074.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">WHAT THIS IS</text><text x="205.0" y="1110.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#2c2c2e" text-anchor="start">A second pair of eyes on</text><text x="205.0" y="1134.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#2c2c2e" text-anchor="start">the lifts you&#x27;re learning.</text><line x1="205.0" y1="1152.0" x2="253.0" y2="1152.0" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" /><text x="205.0" y="1174.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">Upload a short video of your set. FormFix follows how</text><text x="205.0" y="1194.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">you move, then tells you which part of your technique to</text><text x="205.0" y="1214.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">work on - and why it matters.</text><text x="205.0" y="1236.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.4">THE THREE MOVEMENTS</text><rect x="205.0" y="1250.0" width="101.1" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="214.0" y="1262.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">BARBELL SQUAT</text><rect x="314.1" y="1250.0" width="107.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="323.1" y="1262.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SHOULDER PRESS</text><rect x="429.7" y="1250.0" width="94.7" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="438.7" y="1262.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">LAT PULLDOWN</text><circle cx="208.0" cy="1286.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="221.0" y="1290.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">No account, no setup. Your video is deleted the moment the</text><text x="221.0" y="1307.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">analysis finishes.</text><rect x="205.0" y="1329.0" width="350.0" height="160.0" rx="5" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.4" /><text x="223.0" y="1355.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#2c2c2e" text-anchor="start" letter-spacing="1.2">BUILT FOR YOU IF</text><line x1="223.0" y1="1369.0" x2="537.0" y2="1369.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><circle cx="231.0" cy="1389.0" r="7" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1393.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="249.0" y="1393.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">You are learning these three lifts</text><circle cx="231.0" cy="1423.0" r="7" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1427.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="249.0" y="1427.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">You train without a coach watching</text><circle cx="231.0" cy="1457.0" r="7" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1461.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="249.0" y="1461.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">You would rather know what to fix than get a</text><text x="249.0" y="1477.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">score</text><rect x="205.0" y="1503.0" width="350.0" height="160.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="223.0" y="1529.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.2">WHAT IT DOES NOT DO</text><line x1="223.0" y1="1543.0" x2="537.0" y2="1543.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><circle cx="231.0" cy="1563.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1567.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="249.0" y="1567.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Write your training programme</text><circle cx="231.0" cy="1597.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1601.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="249.0" y="1601.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Tell you how much to lift</text><circle cx="231.0" cy="1631.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="231.0" y="1635.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="8" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="249.0" y="1635.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Make any claim about injury or health</text></g><text x="44" y="1761" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="185.0" y="130" width="390" height="1603" /></clipPath></defs></svg>