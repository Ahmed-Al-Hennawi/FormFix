ue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">forward, whether your heels stay planted, and</text><text x="164.0" y="509.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">whether you stand tall between repetitions.</text><circle cx="168.0" cy="544.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="182.0" y="548.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Hip depth</text><circle cx="168.0" cy="568.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="182.0" y="572.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Torso angle</text><circle cx="168.0" cy="592.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="182.0" y="596.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Heel contact</text><circle cx="168.0" cy="616.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="182.0" y="620.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Return to standing</text><rect x="564.0" y="348.0" width="400.0" height="430.0" rx="5" fill="#eeeeef" stroke="#c2c2c6" stroke-width="1" /><line x1="564.0" y1="348.0" x2="964.0" y2="778.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><line x1="964.0" y1="348.0" x2="564.0" y2="778.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><rect x="574.0" y="748.0" width="126.4" height="20.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="584.0" y="762.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start" letter-spacing="0.5">exercise p