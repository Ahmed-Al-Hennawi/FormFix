<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1202" viewBox="0 0 1528 1202" role="img" aria-label="Analyse — idle (no video selected) wireframe"><title>Analyse — idle (no video selected)</title><rect width="1528" height="1202" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Analyse — idle (no video selected)</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Desktop 1440px · components/analyse_page.py · session stage: idle</text><text x="1484" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="1484" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">06-analyse-idle-desktop.svg</text><rect x="44.0" y="96" width="1440" height="1060" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M44.0 106 a10 10 0 0 1 10 -10 h1420 a10 10 0 0 1 10 10 v30 h-1440 z" fill="#f0f0f1" stroke="#c2c2c6" /><circle cx="64.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="79.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="94.0" cy="116" r="4.5" fill="#d5d5d8" /><rect x="120.0" y="106" width="360" height="20" rx="10" fill="#ffffff" stroke="#c2c2c6" /><text x="132.0" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8a8f">formfix.app/analyse</text><line x1="44.0" y1="136" x2="1484.0" y2="136" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="164.0" y="188.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#5f5f63" text-anchor="start">←   Back Home</text><rect x="1214.0" y="168.0" width="30.0" height="26.0" rx="4" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="1252.0" y="188.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#2c2c2e" text-anchor="start">FORMFIX</text><text x="164.0" y="264.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">ANALYSE YOUR FORM</text><text x="164.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2c2c2e" text-anchor="start">Upload a set.</text><text x="164.0" y="362.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2c2c2e" text-anchor="start">Get an explanation.</text><text x="164.0" y="404.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">Record a single set, drop the clip in, and FormFix will track your body through the movement and explain what it</text><text x="164.0" y="426.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">sees. Each exercise has its own camera view - the guidance below the exercise picker tells you which.</text><circle cx="384.0" cy="504.0" r="19" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.6" /><circle cx="384.0" cy="504.0" r="6" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="384.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="middle">Upload Video</text><line x1="410.0" y1="504.0" x2="738.0" y2="504.0" stroke="#dededf" stroke-width="2" stroke-linecap="round" /><circle cx="764.0" cy="504.0" r="19" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.6" /><text x="764.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="middle">Analyse Form</text><line x1="790.0" y1="504.0" x2="1118.0" y2="504.0" stroke="#dededf" stroke-width="2" stroke-linecap="round" /><circle cx="1144.0" cy="504.0" r="19" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.6" /><text x="1144.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="middle">Feedback</text><rect x="164.0" y="608.0" width="34.0" height="26.0" rx="5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="181.0" y="626.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2c2c2e" text-anchor="middle">01</text><text x="212.0" y="627.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2c2c2e" text-anchor="start">Your video</text><text x="322.0" y="627.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">MP4 · MOV · AVI · 3-120 seconds · one set per clip</text><text x="164.0" y="676.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5f5f63" text-anchor="start">Which exercise?</text><circle cx="172.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><circle cx="172.0" cy="702.0" r="3.5" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="188.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Squat</text><circle cx="340.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="356.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Shoulder Press</text><circle cx="508.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="524.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Lat Pulldown</text><rect x="164.0" y="732.0" width="560.0" height="122.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="182.0" y="756.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">HOW TO RECORD</text><rect x="594.0" y="742.0" width="102.8" height="19.0" rx="9.5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="603.0" y="754.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SIDE-ON VIEW</text><circle cx="186.0" cy="776.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="780.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Film from the side, roughly level with your hips.</text><circle cx="186.0" cy="798.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="802.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep your hips, knees and ankles in frame for the whole set.</text><circle cx="186.0" cy="820.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="824.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep the camera still, and record several controlled repetitions.</text><circle cx="186.0" cy="842.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="846.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Start standing, perform several full squats, and finish standing.</text><rect x="164.0" y="880.0" width="560.0" height="104.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="6 5" /><rect x="188.0" y="914.0" width="34.0" height="34.0" rx="6" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="205.0" y="936.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8a8a8f" text-anchor="middle">↥</text><text x="238.0" y="926.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Drag and drop file here</text><text x="238.0" y="946.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">Limit 200MB per file · MP4, MOV, AVI</text><rect x="592.0" y="916.0" width="108.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="646.0" y="936.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#2c2c2e" text-anchor="middle">Browse files</text><text x="164.0" y="1016.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">Drag &amp; drop or browse · .mp4 · .mov · .avi</text><text x="164.0" y="1034.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Your video is deleted as soon as it has been analysed, the result is erased a few hours later, and no account is needed.</text><line x1="164.0" y1="1045.0" x2="164.0" y2="1075.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="171.0" y="1054.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Idle state: no video selected. The right-hand column shows what the result will contain, and nothing</text><text x="171.0" y="1068.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">is analysed until the user presses Analyse Form.</text><rect x="804.0" y="608.0" width="560.0" height="300.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="6 5" /><text x="832.0" y="648.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">WAITING FOR A VIDEO</text><text x="832.0" y="684.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c2c2e" text-anchor="start">Your results will appear here</text><text x="832.0" y="714.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">Choose your exercise and upload a short clip of one set. Nothing is analysed</text><text x="832.0" y="734.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">until you press Analyse Form.</text><circle cx="836.0" cy="772.0" r="3.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="852.0" y="776.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Form score</text><text x="936.0" y="776.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">An overall score out of 100</text><circle cx="836.0" cy="802.0" r="3.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="852.0" y="806.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2c2c2e" text-anchor="start">What you did well</text><text x="987.8" y="806.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">The parts of the movement that looked right</text><circle cx="836.0" cy="832.0" r="3.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="852.0" y="836.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#2c2c2e" text-anchor="start">What to improve</text><text x="973.0" y="836.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Each issue, with a clear correction</text><line x1="804.0" y1="945.0" x2="804.0" y2="975.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="811.0" y="954.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Two-column layout on desktop; Streamlit stacks the columns below 640px, so the upload panel comes</text><text x="811.0" y="968.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">first on mobile.</text></g><text x="44" y="1184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="1020" /></clipPath></defs></svg>