-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="#2c2c2e" text-anchor="start">FORMFIX</text><text x="164.0" y="264.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">ANALYSE YOUR FORM</text><text x="164.0" y="314.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2c2c2e" text-anchor="start">Upload a set.</text><text x="164.0" y="362.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#2c2c2e" text-anchor="start">Get an explanation.</text><text x="164.0" y="404.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">Record a single set, drop the clip in, and FormFix will track your body through the movement and explain what it</text><text x="164.0" y="426.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">sees. Each exercise has its own camera view - the guidance below the exercise picker tells you which.</text><circle cx="384.0" cy="504.0" r="19" fill="#3a3a3c" stroke="#3a3a3c" stroke-width="1.6" /><text x="384.0" y="509.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="384.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="middle">Upload Video</text><line x1="410.0" y1="504.0" x2="738.0" y2="504.0" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" /><circle cx="764.0" cy="504.0" r="19" fill="#3a3a3c" stroke="#3a3a3c" stroke-width="1.6" /><text x="764.0" y="509.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="764.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="middle">Analyse Form</text><line x1="790.0" y1="504.0" x2="1118.0" y2="504.0" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" /><circle cx="1144.0" cy="504.0" r="19" fill="#3a3a3c" stroke="#3a3a3c" stroke-width="1.6" /><text x="1144.0" y="509.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="1144.0" y="542.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2c2c2e" text-anchor="middle">Feedback</text><rect x="164.0" y="608.0" width="34.0" height="26.0" rx="5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="181.0" y="626.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2c2c2e" text-anchor="middle">01</text><text x="212.0" y="627.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2c2c2e" text-anchor="start">Your video</text><text x="322.0" y="627.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">MP4 · MOV · AVI · 3-120 seconds · one set per clip</text><text x="164.0" y="676.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#5f5f63" text-anchor="start">Which exercise?</text><circle cx="172.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><circle cx="172.0" cy="702.0" r="3.5" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="188.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Squat</text><circle cx="340.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="356.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Shoulder Press</text><circle cx="508.0" cy="702.0" r="7" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="524.0" y="706.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#2c2c2e" text-anchor="start">Lat Pulldown</text><rect x="164.0" y="732.0" width="560.0" height="122.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="182.0" y="756.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">HOW TO RECORD</text><rect x="594.0" y="742.0" width="102.8" height="19.0" rx="9.5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="603.0" y="754.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SIDE-ON VIEW</text><circle cx="186.0" cy="776.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="780.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Film from the side, roughly level with your hips.</text><circle cx="186.0" cy="798.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="802.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep your hips, knees and ankles in frame for the whole set.</text><circle cx="186.0" cy="820.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="824.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep the camera still, and record several controlled repetitions.</text><circle cx="186.0" cy="842.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="198.0" y="846.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Start standing, perform several full squats, and finish standing.</text><rect x="164.0" y="880.0" width="560.0" height="104.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="6 5" /><rect x="188.0" y="914.0" width="34.0" height="34.0" rx="6" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="205.0" y="936.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#8a8a8f" text-anchor="middle">↥</text><text x="238.0" y="926.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">Drag and drop file here</text><text x="238.0" y="946.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">Limit 200MB per file · MP4, MOV, AVI</text><rect x="592.0" y="916.0" width="108.0" height="32.0" rx="16.0" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="646.0" y="936.2" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#2c2c2e" text-anchor="middle">Browse files</text><rect x="164.0" y="1008.0" width="560.0" height="56.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><circle cx="194.0" cy="1036.0" r="13" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="194.0" y="1041.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="220.0" y="1033.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2c2c2e" text-anchor="start">Video uploaded successfully</text><text x="220.0" y="1051.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">squat_session_004.mp4 · 8.4 MB</text><rect x="164.0" y="1084.0" width="560.0" height="300.0" rx="5" fill="#eeeeef" stroke="#c2c2c6" stroke-width="1" /><line x1="164.0" y1="1084.0" x2="724.0" y2="1384.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><line x1="724.0" y1="1084.0" x2="164.0" y2="1384.0" stroke="#d2d2d5" stroke-width="1" stroke-linecap="round" /><rect x="174.0" y="1354.0" width="143.2" height="20.0" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="184.0" y="1368.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start" letter-spacing="0.5">uploaded video preview</text><rect x="176.0" y="1344.0" width="536.0" height="28.0" rx="14" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="194.0" y="1363.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#5f5f63" text-anchor="start">▶</text><line x1="212.0" y1="1358.0" x2="664.0" y2="1358.0" stroke="#dededf" stroke-width="3" stroke-linecap="round" /><text x="680.0" y="1363.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8f" text-anchor="start">0:12</text><rect x="164.0" y="1408.0" width="324.8" height="48.0" rx="24.0" fill="#3a3a3c" stroke="none" /><text x="326.4" y="1436.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Analyse again</text><rect x="500.0" y="1408.0" width="224.0" height="48.0" rx="24.0" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="612.0" y="1436.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#2c2c2e" text-anchor="middle">Remove video</text><rect x="804.0" y="608.0" width="560.0" height="330.0" rx="5" fill="#f4f4f5" stroke="#3a3a3c" stroke-width="1.4" /><text x="832.0" y="648.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">ANALYSIS NOT POSSIBLE</text><text x="832.0" y="686.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#2c2c2e" text-anchor="start">We couldn&#x27;t analyse this recording</text><text x="832.0" y="716.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">FormFix could not see your hips, knees and ankles clearly enough to measure the</text><text x="832.0" y="736.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f63" text-anchor="start">movement. Nothing was scored.</text><rect x="832.0" y="764.0" width="504.0" height="118.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="852.0" y="790.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">FOR THE BEST RESULT</text><circle cx="856.0" cy="812.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="868.0" y="816.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Film from the side, roughly level with your hips.</text><circle cx="856.0" cy="834.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="868.0" y="838.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep your hips, knees and ankles in frame for the whole set.</text><circle cx="856.0" cy="856.0" r="2.5" fill="#8a8a8f" stroke="" stroke-width="1" /><text x="868.0" y="860.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Keep the camera still, and record several controlled repetitions.</text><text x="832.0" y="906.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">Nothing was scored - FormFix never guesses when it cannot see the movement clearly. Adjust</text><text x="832.0" y="922.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">the recording and upload again.</text><line x1="804.0" y1="947.0" x2="804.0" y2="1005.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="811.0" y="956.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">This screen carries whichever reason applies. As well as an unclear recording, a run stops when the</text><text x="811.0" y="970.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">movement contradicts the exercise selected (a bench press uploaded as a shoulder press) or when</text><text x="811.0" y="984.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">tracking repeatedly loses which person to follow. Other people merely being in shot only adds a note</text><text x="811.0" y="998.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">to the result.</text><line x1="804.0" y1="1059.0" x2="804.0" y2="1089.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="811.0" y="1068.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Never a bare &#x27;analysis failed&#x27;: the panel states what could not be measured, why, and what to change</text><text x="811.0" y="1082.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">before uploading again.</text></g><text x="44" y="1544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="1380" /></clipPath></defs></svg>