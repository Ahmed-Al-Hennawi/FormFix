<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="670" viewBox="0 0 1528 670" role="img" aria-label="Homepage — what this is, and who it is for wireframe"><title>Homepage — what this is, and who it is for</title><rect width="1528" height="670" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Homepage — what this is, and who it is for</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Desktop 1440px · components/about.py · section 1b, between hero and problem</text><text x="1484" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="1484" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">02b-home-about-desktop.svg</text><rect x="44.0" y="96" width="1440" height="528" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M44.0 106 a10 10 0 0 1 10 -10 h1420 a10 10 0 0 1 10 10 v30 h-1440 z" fill="#f0f0f1" stroke="#c2c2c6" /><circle cx="64.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="79.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="94.0" cy="116" r="4.5" fill="#d5d5d8" /><rect x="120.0" y="106" width="360" height="20" rx="10" fill="#ffffff" stroke="#c2c2c6" /><text x="132.0" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8a8f">formfix.app/</text><line x1="44.0" y1="136" x2="1484.0" y2="136" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="164.0" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.6">WHAT THIS IS</text><text x="164.0" y="220.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2c2c2e" text-anchor="start">A second pair of eyes on</text><text x="164.0" y="254.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#2c2c2e" text-anchor="start">the lifts you&#x27;re learning.</text><line x1="164.0" y1="284.0" x2="220.0" y2="284.0" stroke="#3a3a3c" stroke-width="2" stroke-linecap="round" /><text x="164.0" y="310.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">Upload a short video of your set. FormFix follows how you move, then tells</text><text x="164.0" y="333.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#5f5f63" text-anchor="start">you which part of your technique to work on - and why it matters.</text><text x="164.0" y="384.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.5">THE THREE MOVEMENTS</text><rect x="164.0" y="398.0" width="105.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="173.0" y="410.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">BARBELL SQUAT</text><rect x="279.5" y="398.0" width="112.2" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="288.5" y="410.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">SHOULDER PRESS</text><rect x="401.7" y="398.0" width="98.8" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="410.7" y="410.7" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">LAT PULLDOWN</text><circle cx="168.0" cy="450.0" r="3" fill="#3a3a3c" stroke="" stroke-width="1" /><text x="182.0" y="454.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">No account, no setup. Your video is deleted the moment the analysis</text><text x="182.0" y="472.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a8a8f" text-anchor="start">finishes.</text><rect x="804.0" y="212.0" width="560.0" height="146.0" rx="5" fill="#ffffff" stroke="#3a3a3c" stroke-width="1.4" /><text x="828.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#2c2c2e" text-anchor="start" letter-spacing="1.3">BUILT FOR YOU IF</text><line x1="828.0" y1="256.0" x2="1340.0" y2="256.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><circle cx="836.0" cy="280.0" r="8" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="856.0" y="284.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">You are learning these three lifts</text><circle cx="836.0" cy="308.0" r="8" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="312.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="856.0" y="312.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">You train without a coach watching</text><circle cx="836.0" cy="336.0" r="8" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="340.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#2c2c2e" text-anchor="middle">✓</text><text x="856.0" y="340.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">You would rather know what to fix than get a score</text><rect x="804.0" y="378.0" width="560.0" height="146.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="828.0" y="408.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8a8a8f" text-anchor="start" letter-spacing="1.3">WHAT IT DOES NOT DO</text><line x1="828.0" y1="422.0" x2="1340.0" y2="422.0" stroke="#c2c2c6" stroke-width="1" stroke-linecap="round" /><circle cx="836.0" cy="446.0" r="8" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="450.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="856.0" y="450.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Write your training programme</text><circle cx="836.0" cy="474.0" r="8" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="478.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="856.0" y="478.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Tell you how much to lift</text><circle cx="836.0" cy="502.0" r="8" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="836.0" y="506.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#8a8a8f" text-anchor="middle">—</text><text x="856.0" y="506.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">Make any claim about injury or health</text><line x1="804.0" y1="547.0" x2="804.0" y2="577.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="811.0" y="556.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Added after supervisor feedback: the hero says what the system does but not who it is for. A</text><text x="811.0" y="570.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">statement beside two scannable panels, so the exclusions are as visible as the promise.</text></g><text x="44" y="652" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="488" /></clipPath></defs></svg>