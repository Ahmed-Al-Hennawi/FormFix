<svg xmlns="http://www.w3.org/2000/svg" width="1528" height="1320" viewBox="0 0 1528 1320" role="img" aria-label="Analyse — results with the detail panel expanded wireframe"><title>Analyse — results with the detail panel expanded</title><rect width="1528" height="1320" fill="#e9e9ea" /><text x="44" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#2c2c2e">Analyse — results with the detail panel expanded</text><text x="44" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8a8a8f">Desktop 1440px · level 3 of the progressive disclosure</text><text x="1484" y="40" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#b4b4b8" text-anchor="end" letter-spacing="1.8">FORMFIX &#183; WIREFRAME</text><text x="1484" y="62" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#b4b4b8" text-anchor="end">10-analyse-results-expanded-desktop.svg</text><rect x="44.0" y="96" width="1440" height="1178" rx="10" fill="#ffffff" stroke="#c2c2c6" stroke-width="1.4" /><path d="M44.0 106 a10 10 0 0 1 10 -10 h1420 a10 10 0 0 1 10 10 v30 h-1440 z" fill="#f0f0f1" stroke="#c2c2c6" /><circle cx="64.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="79.0" cy="116" r="4.5" fill="#d5d5d8" /><circle cx="94.0" cy="116" r="4.5" fill="#d5d5d8" /><rect x="120.0" y="106" width="360" height="20" rx="10" fill="#ffffff" stroke="#c2c2c6" /><text x="132.0" y="120" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#8a8a8f">formfix.app/analyse</text><line x1="44.0" y1="136" x2="1484.0" y2="136" stroke="#c2c2c6" /><g clip-path="url(#clip)"><text x="164.0" y="176.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2c2c2e" text-anchor="start">Results column, scrolled to the bottom</text><text x="164.0" y="204.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">The first two levels (verdict, corrections, positives, measured checks,</text><text x="164.0" y="223.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">annotated video and reference clip) are shown in the previous wireframe. This</text><text x="164.0" y="242.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5f5f63" text-anchor="start">sheet documents what opens underneath them.</text><line x1="164.0" y1="297.0" x2="164.0" y2="341.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="171.0" y="306.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Level 3 stays in plain language for the athlete. The full traceability chain —</text><text x="171.0" y="320.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">measurement, landmarks, movement phase, rule id, threshold provenance — is level 4 and</text><text x="171.0" y="334.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">appears only under FORMFIX_DEBUG.</text><rect x="804.0" y="166.0" width="560.0" height="46.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="824.0" y="195.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5f5f63" text-anchor="start">▾</text><text x="846.0" y="195.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2c2c2e" text-anchor="start">See the full detail — how FormFix measured every rep</text><rect x="804.0" y="212.0" width="560.0" height="8.0" rx="0" fill="#f4f4f5" stroke="none" /><text x="824.0" y="248.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Everything behind the summary above: how each finding was detected, how every repetition</text><text x="824.0" y="266.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">scored, and which checks could not be assessed from this recording.</text><rect x="824.0" y="300.0" width="520.0" height="92.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="328.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Squat depth</text><text x="844.0" y="352.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Two of your six repetitions stopped above parallel.</text><rect x="844.0" y="364.0" width="74.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="853.0" y="376.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">TRY THIS</text><text x="916.0" y="377.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Lower until your hip crease passes your knee, under control.</text><rect x="824.0" y="404.0" width="520.0" height="92.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="432.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Forward torso lean</text><text x="844.0" y="456.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Your chest dropped forward on the third repetition.</text><rect x="844.0" y="468.0" width="74.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="853.0" y="480.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">TRY THIS</text><text x="916.0" y="481.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Think about keeping your chest up as you come out of the bottom.</text><rect x="824.0" y="508.0" width="520.0" height="92.0" rx="5" fill="#ffffff" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="536.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Descent control</text><rect x="976.0" y="522.0" width="102.8" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="985.0" y="534.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">ALSO NOTICED</text><text x="844.0" y="560.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">One repetition was lowered noticeably faster than the rest.</text><rect x="844.0" y="572.0" width="74.5" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="853.0" y="584.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">TRY THIS</text><text x="916.0" y="585.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">Take about two seconds to lower, then drive back up.</text><text x="824.0" y="638.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c2c2e" text-anchor="start">Repetition by repetition</text><rect x="1254.0" y="624.0" width="60.4" height="19.0" rx="9.5" fill="#ebebec" stroke="#c2c2c6" stroke-width="1" /><text x="1263.0" y="636.9" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#8a8a8f" text-anchor="start" letter-spacing="0.7">6 REPS</text><rect x="824.0" y="662.0" width="520.0" height="62.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="688.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Rep 01</text><text x="914.0" y="688.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Good repetition</text><text x="914.0" y="708.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Passed: depth, torso, heels</text><text x="1320.0" y="688.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="end">0:02</text><rect x="824.0" y="732.0" width="520.0" height="62.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="758.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Rep 02</text><text x="914.0" y="758.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Stopped above depth</text><text x="914.0" y="778.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Squat depth · Passed: torso, heels</text><text x="1320.0" y="758.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="end">0:04</text><rect x="824.0" y="802.0" width="520.0" height="62.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="828.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Rep 03</text><text x="914.0" y="828.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Chest dropped forward</text><text x="914.0" y="848.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Forward torso lean · Passed: depth, heels</text><text x="1320.0" y="828.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="end">0:06</text><rect x="824.0" y="872.0" width="520.0" height="62.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" /><text x="844.0" y="898.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2c2c2e" text-anchor="start">Rep 04</text><text x="914.0" y="898.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Good repetition</text><text x="914.0" y="918.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="start">Passed: depth, torso, heels</text><text x="1320.0" y="898.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8f" text-anchor="end">0:08</text><text x="844.0" y="948.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a8f" text-anchor="start">…</text><text x="824.0" y="992.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2c2c2e" text-anchor="start">Not assessed</text><text x="824.0" y="1014.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">These checks need something this recording could not show, so FormFix left them unscored</text><text x="824.0" y="1031.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5f5f63" text-anchor="start">rather than guessing.</text><rect x="824.0" y="1038.0" width="520.0" height="46.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="5 4" /><text x="844.0" y="1066.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Knee tracking</text><text x="1004.0" y="1066.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">Needs a front-on camera; this clip was filmed from the side.</text><rect x="824.0" y="1092.0" width="520.0" height="46.0" rx="5" fill="#f4f4f5" stroke="#c2c2c6" stroke-width="1" stroke-dasharray="5 4" /><text x="844.0" y="1120.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#2c2c2e" text-anchor="start">Bar path</text><text x="1004.0" y="1120.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8a8f" text-anchor="start">No barbell was detected in the frame.</text><line x1="824.0" y1="1161.0" x2="824.0" y2="1191.0" stroke="#b4b4b8" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round" /><text x="831.0" y="1170.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">Under FORMFIX_DEBUG each finding also prints its measurement, landmarks, movement phase, rule</text><text x="831.0" y="1184.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#b4b4b8" text-anchor="start" font-style="italic">settings and threshold provenance.</text></g><text x="44" y="1302" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="10" fill="#b4b4b8">Mid-fidelity wireframe &#183; real interface copy &#183; grey bars represent body text &#183; not to scale</text><defs><clipPath id="clip"><rect x="44.0" y="136" width="1440" height="1138" /></clipPath></defs></svg>