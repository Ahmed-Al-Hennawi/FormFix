# FormFix - lint configuration.
# Standard rules: errors, pyflakes, warnings, imports, bugbear, pyupgrade and
# simplify. No nitpicky style rules.
line-length = 104
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",   # long lines in markup-building components are intentional
    "SIM117", # nested `with` blocks read better for container+expander UI
    "UP022",  # explicit stdout/stderr PIPE mirrors the timeout handling
    "UP042",  # str-Enums are deliberate: .value strings flow into JSON/UI
]

[lint.per-file-ignores]
# these add the app folder to sys.path before importing
"app.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
