# ==========================================================================
# FormFix - tooling configuration
#
# Line length has to match ruff.toml, or black and ruff fight each other.
# ==========================================================================

[tool.black]
line-length = 104
target-version = ["py311"]
extend-exclude = '''
/(
    \.venv
  | \.pytest_cache
  | \.ruff_cache
)/
'''
